image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - verify

verify:
  stage: verify
  script:
    - dotnet restore OpenRouterRoutingDemo.sln --locked-mode
    - dotnet build OpenRouterRoutingDemo.sln --configuration Release --no-restore
    - dotnet test OpenRouterRoutingDemo.sln --configuration Release --no-build
    - dotnet format OpenRouterRoutingDemo.sln --verify-no-changes --no-restore
