name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpenRouterRoutingDemo.sln --locked-mode

      - name: Build
        run: dotnet build OpenRouterRoutingDemo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenRouterRoutingDemo.sln --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format OpenRouterRoutingDemo.sln --verify-no-changes --no-restore
